<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<title>词性小剧场 · 小学生英语词性互动游戏</title>
<meta name="description" content="用认知负荷理论与交替实例原则设计的英语词性学习游戏：名词、动词、形容词、副词，玩着玩着就会了。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-deco" aria-hidden="true"><span>🏰</span><span>🏃</span><span>🎨</span><span>⚡</span></div>

<main class="app">
  <header class="topbar">
    <button class="ghost-btn" id="btnHome" title="回到地图" aria-label="回到地图">🗺️</button>
    <div class="ttl" id="ttl">词性小剧场</div>
    <div class="hearts" id="hearts" hidden aria-label="剩余爱心"></div>
    <div class="stars" id="stars" aria-label="星星数">⭐ <span id="starNum">0</span></div>
    <button class="ghost-btn" id="btnSet" title="设置" aria-label="设置">⚙️</button>
  </header>

  <section class="stage" id="stage" aria-live="polite"></section>
  <div class="hint" id="hint" aria-live="polite"></div>
</main>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
