<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<title>词性小剧场 · 小学生英语词性互动游戏</title>
<meta name="description" content="用认知负荷理论与交替实例原则设计的英语词性学习游戏：名词、动词、形容词、副词，玩着玩着就会了。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="词性小剧场 · 小学生英语词性互动游戏">
<meta property="og:description" content="名词、动词、形容词、副词四个角色各守一个岗位，8 关闯下来就会区分了。按认知负荷理论与交替实例原则设计。">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<style>
/* ============================================================
   词性小剧场 · Word Theater
   认知负荷理论 + 交替实例原则 的互动英语词性游戏
   ============================================================ */

:root{
  --ink:#2f2a3d;
  --sub:#6b6480;
  --paper:#fffdf8;
  --line:#ece2d0;
  --line-2:#e0d3bd;

  --n:#e07a1f;      /* 名词 orange */
  --n-bg:#fdf1e4;
  --n-line:#f2cfa5;

  --v:#1f9e68;      /* 动词 green */
  --v-bg:#e6f7ef;
  --v-line:#a9e2c6;

  --a:#3679cf;      /* 形容词 blue */
  --a-bg:#e9f1fd;
  --a-line:#b3cdf3;

  --d:#8f45c9;      /* 副词 purple */
  --d-bg:#f4eafc;
  --d-line:#d7b6ef;

  --p:#0f8f9e;      /* 介词 teal */
  --p-bg:#e4f6f8;
  --p-line:#a7dde4;

  --gold:#f7b731;
  --gold-dark:#d99413;
  --red:#e5484d;
  --green:#22a06b;

  --shadow: 0 10px 30px rgba(96,74,52,.10), 0 2px 6px rgba(96,74,52,.06);
  --chunk: 0 4px 0 var(--line-2);

  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 8% -10%, #fef6e2 0%, rgba(254,246,226,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #eef6ff 0%, rgba(238,246,255,0) 55%),
    radial-gradient(800px 700px at 50% 110%, #f7ecfd 0%, rgba(247,236,253,0) 60%),
    #fbf7ef;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* 背景小装饰 */
.bg-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg-deco span{position:absolute;font-size:44px;opacity:.16;filter:blur(.3px)}
.bg-deco span:nth-child(1){left:3%;top:12%;transform:rotate(-12deg)}
.bg-deco span:nth-child(2){right:5%;top:8%;transform:rotate(9deg)}
.bg-deco span:nth-child(3){left:8%;bottom:10%;transform:rotate(6deg)}
.bg-deco span:nth-child(4){right:7%;bottom:14%;transform:rotate(-8deg)}

.app{
  position:relative;z-index:1;
  width:100%;
  max-width:820px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:14px 14px 16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}

/* ---------------- 顶栏 ---------------- */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:2px 2px 6px;
  border-bottom:1px dashed var(--line);
}
.ttl{
  flex:1;text-align:center;
  font-weight:800;font-size:15px;letter-spacing:.3px;
  color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ghost-btn{
  border:1px solid var(--line);
  background:#fffdf7;
  border-radius:12px;
  width:38px;height:38px;
  font-size:17px;line-height:1;
  cursor:pointer;
  box-shadow:0 2px 0 var(--line);
  transition:transform .12s ease, box-shadow .12s ease, background .12s;
  flex:none;
}
.ghost-btn:hover{background:#fff;transform:translateY(-1px)}
.ghost-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.stars{
  display:flex;align-items:center;gap:5px;
  font-weight:800;font-size:15px;color:#a8760a;
  background:#fff8e3;border:1px solid #f6dfa2;
  padding:7px 13px;border-radius:999px;
  flex:none;
  transition:transform .2s;
}
.stars.pop{transform:scale(1.18)}
.hearts{
  display:flex;align-items:center;gap:1px;flex:none;
  font-size:13px;line-height:1;
  padding:0 1px;
}
.hearts span{transition:transform .25s, opacity .25s, filter .25s}
.hearts span.gone{opacity:.3;filter:grayscale(1) opacity(.55);transform:scale(.78)}
.hearts.pop{animation:pop .35s}

/* ---------------- 舞台 ---------------- */
.stage{
  min-height:430px;
  display:flex;flex-direction:column;
  gap:10px;
  flex:0 0 auto;
  animation:fadeUp .34s cubic-bezier(.2,.9,.3,1.05);
}
.stage-body{display:flex;flex-direction:column;gap:12px;min-height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hint{
  min-height:26px;
  margin-top:-4px;
  text-align:center;
  font-size:13.5px;color:var(--sub);
  transition:color .2s;
}
.hint b{color:var(--ink)}

/* ---------------- 通用文字 ---------------- */
.h2{font-size:19px;font-weight:800;margin:0;letter-spacing:.2px}
.h3{font-size:16px;font-weight:800;margin:0}
.lead{font-size:14.5px;color:var(--sub);margin:0}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.center{justify-content:center}
.spacer{flex:1}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------------- 角色徽章 ---------------- */
.role{
  display:inline-flex;align-items:center;gap:5px;
  font-weight:800;font-size:13px;
  padding:3px 10px;border-radius:999px;
  border:1.5px solid transparent;
  white-space:nowrap;
}
.role.n{color:var(--n);background:var(--n-bg);border-color:var(--n-line)}
.role.v{color:var(--v);background:var(--v-bg);border-color:var(--v-line)}
.role.a{color:var(--a);background:var(--a-bg);border-color:var(--a-line)}
.role.d{color:var(--d);background:var(--d-bg);border-color:var(--d-line)}
.role.p{color:var(--p);background:var(--p-bg);border-color:var(--p-line)}

/* ---------------- 主按钮 ---------------- */
.btn{
  border:none;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:16px;
  color:#fff;
  background:linear-gradient(180deg,#ffca49,#f2ad1d);
  padding:13px 26px;border-radius:16px;
  box-shadow:0 4px 0 #cf8e10, 0 8px 18px rgba(207,142,16,.22);
  transition:transform .1s ease, box-shadow .1s ease, filter .15s;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cf8e10}
.btn[disabled]{opacity:.45;box-shadow:0 4px 0 #cf8e10;cursor:not-allowed;filter:grayscale(.35)}
.btn.ghost{
  background:#fff;color:var(--ink);
  border:1.5px solid var(--line-2);
  box-shadow:0 3px 0 var(--line-2);
  font-size:14.5px;padding:10px 18px;
}
.btn.ghost:active{box-shadow:0 1px 0 var(--line-2)}
.btn.small{font-size:14px;padding:9px 16px;border-radius:13px}
.btn:focus-visible,.ghost-btn:focus-visible,.wcard:focus-visible,.bucket:focus-visible,.chip:focus-visible,.opt:focus-visible{
  outline:3px solid #7ab7ff;outline-offset:3px;
}

/* ---------------- 卡片外壳 ---------------- */
.panel{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:var(--r-md);
  padding:14px;
  box-shadow:0 2px 0 var(--line);
}

/* ---------------- 关卡地图 ---------------- */
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .map-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.map-item{
  position:relative;
  text-align:left;cursor:pointer;
  font-family:inherit;
  background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:12px 12px 10px;
  box-shadow:0 3px 0 var(--line);
  transition:transform .12s ease, box-shadow .12s, border-color .12s;
  color:var(--ink);
}
.map-item:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.map-item:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.map-item .mi-emoji{font-size:26px;line-height:1}
.map-item .mi-name{font-weight:800;font-size:14.5px;margin-top:3px}
.map-item .mi-desc{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.35}
.map-item .mi-stars{position:absolute;top:8px;right:10px;font-size:12px;color:var(--gold-dark);font-weight:800}
.map-item.done{border-color:#cfe9d9;background:linear-gradient(180deg,#fbfffd,#f2fbf6)}
.map-item.locked{opacity:.55;cursor:not-allowed;background:#faf7f1}
.map-item.current{border-color:#f0c46a;background:linear-gradient(180deg,#fffdf3,#fff6de);box-shadow:0 3px 0 #f0dfae}
.map-item .lock{position:absolute;right:9px;bottom:7px;font-size:12px;opacity:.7}

/* ---------------- 单词卡 ---------------- */
.pool{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;min-height:60px;
  padding:10px;border-radius:var(--r-md);
  background:repeating-linear-gradient(45deg,#fdfbf5,#fdfbf5 10px,#faf5ea 10px,#faf5ea 20px);
  border:1.5px dashed var(--line-2);
}
.wcard{
  position:relative;
  font-family:inherit;color:var(--ink);
  background:#fff;border:1.5px solid var(--line-2);
  border-radius:14px;padding:9px 6px 7px;
  text-align:center;cursor:pointer;
  box-shadow:0 3px 0 #e7dbc7;
  transition:transform .12s ease, box-shadow .12s, border-color .12s, background .12s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-height:76px;justify-content:center;
}
.wcard:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e7dbc7}
.wcard:active{transform:translateY(1px);box-shadow:0 1px 0 #e7dbc7}
.wcard .wc-emoji{font-size:22px;line-height:1.1}
.wcard .wc-en{font-weight:800;font-size:16px;letter-spacing:.2px;max-width:100%;overflow-wrap:anywhere}
.wcard .wc-zh{font-size:11.5px;color:var(--sub);line-height:1.2}
.wcard.sel{
  border-color:#f0ad2b;background:#fffaec;
  box-shadow:0 0 0 3px #ffe9b5, 0 4px 0 #ecd39a;
  transform:translateY(-3px) scale(1.03);
}
.wcard.used{opacity:.28;pointer-events:none;filter:grayscale(.5)}
.wcard.wrong{animation:shake .38s}
.wcard.ok{animation:pop .32s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px) rotate(-2deg)}
  45%{transform:translateX(6px) rotate(2deg)}
  70%{transform:translateX(-4px)}
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}

/* ---------------- 分类桶 ---------------- */
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buckets.five{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:560px){.buckets.five{grid-template-columns:repeat(5,minmax(0,1fr))}}
.buckets.five .bucket{padding:9px 8px;min-height:66px;position:relative}
.buckets.five .bucket .b-head{flex-direction:column;align-items:flex-start;gap:1px;min-width:0;width:100%}
.buckets.five .bucket .b-head .b-name{white-space:normal;font-size:13px;line-height:1.25;max-width:100%}
.buckets.five .bucket small{flex:0 0 auto;order:0;font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.buckets.five .bucket .b-count{position:absolute;top:6px;right:7px}
.buckets.one-col{grid-template-columns:1fr}
.bucket{
  border-radius:var(--r-md);
  border:2px dashed var(--line-2);
  background:#fff;
  padding:10px;
  min-height:112px;
  cursor:pointer;
  font-family:inherit;color:inherit;text-align:left;
  transition:border-color .15s, background .15s, transform .12s;
  display:flex;flex-direction:column;gap:7px;
}
.bucket:hover{transform:translateY(-1px)}
.bucket .b-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:14px}
.bucket .b-head .b-name{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.buckets.five .b-key{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;background:rgba(0,0,0,.07);color:var(--sub);font-style:normal;font-size:10.5px;font-weight:800;flex:0 0 auto}
@media(hover:none){.buckets.five .b-key{display:none}}
.bucket .b-count{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub)}
.bucket .b-items{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:34px}
.bucket.b-n{border-color:var(--n-line);background:linear-gradient(180deg,#fffaf5,var(--n-bg))}
.bucket.b-v{border-color:var(--v-line);background:linear-gradient(180deg,#f7fffb,var(--v-bg))}
.bucket.b-a{border-color:var(--a-line);background:linear-gradient(180deg,#f9fcff,var(--a-bg))}
.bucket.b-d{border-color:var(--d-line);background:linear-gradient(180deg,#fdf9ff,var(--d-bg))}
.bucket.b-p{border-color:var(--p-line);background:linear-gradient(180deg,#f6feff,var(--p-bg))}
.bucket.flash{animation:pop .4s}
.bucket.hintable{border-style:solid}
.mini{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12.5px;font-weight:700;
  padding:4px 9px;border-radius:10px;
  background:#fff;border:1.5px solid var(--line-2);
  animation:pop .3s;
}
.mini.n{border-color:var(--n-line);color:var(--n);background:#fff}
.mini.v{border-color:var(--v-line);color:var(--v)}
.mini.a{border-color:var(--a-line);color:var(--a)}
.mini.d{border-color:var(--d-line);color:var(--d)}
.mini.p{border-color:var(--p-line);color:var(--p)}

/* ---------------- 句子拼装 ---------------- */
.sentence{
  display:flex;align-items:center;justify-content:center;
  gap:8px;flex-wrap:wrap;
  padding:14px 10px;
  border-radius:var(--r-md);
  background:linear-gradient(180deg,#fffdf6,#fff9ea);
  border:1.5px solid #f3e6c9;
}
.slot{
  min-width:118px;min-height:72px;
  border:2.5px dashed #ddcba6;
  border-radius:14px;
  background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 10px;cursor:pointer;
  transition:border-color .15s, background .15s, transform .12s;
  font-family:inherit;color:var(--ink);
}
.slot .s-ph{font-size:12px;color:#b6a687;font-weight:700}
.slot .s-lab{font-size:10.5px;color:#c0b193;margin-top:2px}
.slot:hover{background:#fffaee}
.slot.filled{border-style:solid;border-color:#f0c46a;background:#fffdf4;box-shadow:0 3px 0 #f3e6c9}
.slot.filled .s-en{font-weight:800;font-size:17px}
.slot.filled .s-zh{font-size:11.5px;color:var(--sub)}
.slot.ok{border-color:var(--green);background:#f2fcf7;box-shadow:0 3px 0 #cbeadd}
.slot.bad{animation:shake .4s;border-color:var(--red);background:#fff5f5}
.plus{font-size:20px;color:#cbb894;font-weight:800}

.stage-scene{
  position:relative;
  height:150px;
  border-radius:var(--r-md);
  background:linear-gradient(180deg,#eef7ff,#f8fcff 65%,#f0f8ee);
  border:1.5px solid #dbeaf6;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.scene-actor{
  font-size:44px;line-height:1;
  position:absolute;bottom:34px;left:12%;
  transition:transform .4s cubic-bezier(.4,1.4,.5,1), font-size .3s, filter .3s;
  transform-origin:center bottom;
}
.scene-ground{
  position:absolute;left:0;right:0;bottom:26px;height:3px;
  background:repeating-linear-gradient(90deg,#cfe3d2 0 10px,transparent 10px 20px);
}
.scene-label{
  position:absolute;top:9px;left:12px;
  font-size:12px;font-weight:700;color:#7899b5;
  background:#ffffffee;border-radius:999px;padding:2px 10px;
}
.scene-sentence{
  position:absolute;bottom:8px;left:0;right:0;text-align:center;
  font-weight:800;font-size:17px;color:#2f5f80;letter-spacing:.3px;
}
.scene-sentence .hl-n{color:var(--n)}
.scene-sentence .hl-v{color:var(--v)}
.scene-sentence .hl-a{color:var(--a)}
.scene-sentence .hl-d{color:var(--d)}
.scene-sentence .hl-p{color:var(--p)}

@keyframes walkFast{0%{transform:translateX(0)}100%{transform:translateX(360px)}}
@keyframes walkSlow{0%{transform:translateX(0)}100%{transform:translateX(300px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.act-fast{animation:walkFast 1.5s linear forwards}
.act-slow{animation:walkSlow 4.2s linear forwards}
.act-jump{animation:hop .7s ease-in-out 2}

/* ---------------- 选择题 ---------------- */
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  font-family:inherit;color:var(--ink);text-align:left;
  background:#fff;border:1.5px solid var(--line-2);
  border-radius:14px;padding:13px 15px;
  cursor:pointer;font-size:16px;font-weight:700;
  box-shadow:0 3px 0 var(--line-2);
  transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  display:flex;align-items:center;gap:9px;
}
.opt:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--line-2)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.opt .o-key{
  flex:none;width:24px;height:24px;border-radius:8px;
  background:#f4efe4;color:#9c8b6d;
  display:grid;place-items:center;font-size:12.5px;font-weight:800;
}
.opt.right{border-color:var(--green);background:#f1fbf6;box-shadow:0 3px 0 #bfe6d5}
.opt.right .o-key{background:#d6f2e5;color:#1c7f57}
.opt.wrong{border-color:var(--red);background:#fff5f5;box-shadow:0 3px 0 #f2c6c7;animation:shake .38s}
.opt[disabled]{cursor:default}

/* ---------------- 句子解剖 ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 8px;
  background:linear-gradient(180deg,#fffdf6,#fff9ea);border:1.5px solid #f3e6c9;border-radius:var(--r-md)}
.chip{
  font-family:inherit;font-size:19px;font-weight:800;color:var(--ink);
  background:#fff;border:1.5px solid var(--line-2);border-radius:12px;
  padding:8px 14px;cursor:pointer;
  box-shadow:0 3px 0 #e7dbc7;
  transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e7dbc7}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 #e7dbc7}
.chip .c-tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:#f4efe4;color:#a3906e}
.chip.found{cursor:default;transform:none}
.chip.found.n{border-color:var(--n);background:var(--n-bg);box-shadow:0 3px 0 var(--n-line)}
.chip.found.v{border-color:var(--v);background:var(--v-bg);box-shadow:0 3px 0 var(--v-line)}
.chip.found.a{border-color:var(--a);background:var(--a-bg);box-shadow:0 3px 0 var(--a-line)}
.chip.found.d{border-color:var(--d);background:var(--d-bg);box-shadow:0 3px 0 var(--d-line)}
.chip.found.p{border-color:var(--p);background:var(--p-bg);box-shadow:0 3px 0 var(--p-line)}
.chip.found.n .c-tag{background:var(--n);color:#fff}
.chip.found.v .c-tag{background:var(--v);color:#fff}
.chip.found.a .c-tag{background:var(--a);color:#fff}
.chip.found.d .c-tag{background:var(--d);color:#fff}
.chip.found.p .c-tag{background:var(--p);color:#fff}
.chip.wrong{animation:shake .38s}

/* ---------------- 说明双卡 ---------------- */

<script>
/* ============================================================
   词性小剧场 · Word Theater
   ------------------------------------------------------------
   设计依据：
   1) 认知负荷理论（CLT）
      - 内在负荷：每关只增加一个新的、必要的信息块（新词性）
      - 外在负荷：同一套交互机制贯穿全部关卡，不引入新操作；
                  标签与题目同屏呈现，避免「注意力分散效应」；

      - 相关负荷：全部为「自己动手做决定」，而不是看讲解
   2) 交替实例原则（Interleaved Practice / Contrastive Examples）
      - 同一深层结构（看意思→问三个问题→定岗位）不断换「故事表皮」

'use strict';

/* ================= 1 · 存档 ================= */

  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { } },
  addStars(n) {
    if (n <= 0) return;
    this.data.stars += n; this.save(); paintStars(true);
  },
  setLevel(id, s) {
    if ((this.data.levels[id] || 0) >= s) return;
    this.data.levels[id] = s; this.save();
  },
  unlocked(id) {
    if (id === 1) return true;
    if (this.data.unlockAll) return true;
    return (this.data.levels[id - 1] || 0) > 0;

/* ================= 5 · 界面骨架 ================= */
const stageEl = () => document.getElementById('stage');
const hintEl = () => document.getElementById('hint');

function paint(html) {
  const st = document.getElementById('stageBody') || stageEl();
  st.innerHTML = html;
  st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
  hintEl().innerHTML = ''; hintEl().style.color = '';
}
function setHint(html, tone) {
  const h = hintEl();
  h.innerHTML = html || '';
  h.style.color = tone === 'bad' ? '#b8362b' : tone === 'ok' ? '#1a7d55' : '';
}
function putHint(html, tone) { setHint(html, tone); }
function paintStars(pop) {
  const el = document.getElementById('starNum');
  if (el) el.textContent = Store.data.stars;
  const bar = document.getElementById('stars');
  if (bar && pop) { bar.classList.add('pop'); setTimeout(() => bar.classList.remove('pop'), 220); }
}
function setTitle(t) { document.getElementById('ttl').textContent = t; }

let toastTimer = null;
function toast(msg, ms = 1600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function sheet(html, opts = {}) {
  const root = document.getElementById('sheetRoot');
  root.innerHTML = `<div class="sheet"><div class="sheet-card">${html}</div></div>`;
  const card = $('.sheet-card', root);
  if (opts.closable !== false) {
    $('.sheet', root).addEventListener('click', e => { if (e.target.classList.contains('sheet')) closeSheet(); });
  }
  return card;
}
function closeSheet() { document.getElementById('sheetRoot').innerHTML = ''; }

      </div>
      <div class="${newKeys.length > 1 ? 'duo' : ''}" style="${newKeys.length > 1 ? '' : 'max-width:360px;margin:0 auto;width:100%'}">
        ${cards}
      </div>
      ${oldChips}
      <div class="row center" style="margin-top:6px">
        <button class="btn" id="next">我记住了 · 开始 →</button>
      </div>
    `);
    putHint('点一下例句，可以听听它怎么读 🔊', 'tip');

    $$('.eg').forEach(b => b.addEventListener('click', () => { Sound.tap(); Sound.say(b.dataset.say); }));

/* ================= 8 · 提示文案 ================= */
function wrongTip(word, bucketKey) {
  const p = POS[word.pos];
  return `${word.en}（${word.zh}）好像不是「${POS[bucketKey].name}」哦 —— 想一想：${p.probe}`;
}
function revealTip(word) {
  const p = POS[word.pos];
  return `${p.emoji} <b>${word.en}</b> 是<b>${p.name}</b>：${p.probe}`;
}

  return new Promise(resolve => {

    let sel = null, resolved = 0, wrongTotal = 0, locked = false;

    const total = items.length;

          ${buckets.map((k, bi) => `<button class="bucket b-${k}" data-b="${k}">
            <span class="b-head"><span class="b-name"><i class="b-key">${bi + 1}</i>${POS[k].emoji} ${POS[k].name}</span><small>· ${POS[k].short}</small>

            <span class="b-items" data-items="${k}"></span>

    `);
    putHint(`${items.length} 个单词，${buckets.length} 个岗位。慢慢来，一次只看一个词。`, 'tip');

    const pool = $('#pool'), bks = $('#buckets');

    const updateBar = () => {
      $('#pbar').style.width = (resolved / total * 100) + '%';
      $('#pnum').textContent = `${resolved}/${total}`;
    };

    const correct = (card, w) => {
      card.classList.remove('sel');
      card.classList.add('ok');
      setTimeout(() => { card.classList.add('used'); card.classList.remove('ok'); }, 200);
      const host = $(`[data-items="${w.pos}"]`, bks);
      host.insertAdjacentHTML('beforeend', `<span class="mini ${w.pos}">${w.emoji || ''} ${esc(w.en)}</span>`);
      const cnt = $(`[data-c="${w.pos}"]`, bks);
      cnt.textContent = String(Number(cnt.textContent) + 1);
      const bucket = $(`[data-b="${w.pos}"]`, bks);
      bucket.classList.add('flash'); setTimeout(() => bucket.classList.remove('flash'), 420);
      resolved++; updateBar();
      Sound.ok(); Sound.say(w.en);
      setHint(`✅ <b>${esc(w.en)}</b> 是${POS[w.pos].name} —— ${POS[w.pos].probe}`, 'ok');
      sel = null;
      if (resolved === total) {
        locked = true;
        setTimeout(() => { onDone(wrongTotal); resolve(); }, 780);
      }
    };

    const wrong = (card, w, bucketKey) => {
      card.classList.remove('sel');
      card.classList.add('wrong');
      setTimeout(() => card.classList.remove('wrong'), 400);
      wrongCount[w.en] = (wrongCount[w.en] || 0) + 1;
      wrongTotal++;
      Sound.no();
      if (noteWrong()) { locked = true; setTimeout(levelFailed, 600); return; }
      if (wrongCount[w.en] >= 2) {
        // 支持渐隐：连续错两次后，直接给出「岗位徽章 + 目标高亮」
        if (!$('.role', card)) {
          card.insertAdjacentHTML('beforeend', `<span class="role ${w.pos}">${POS[w.pos].emoji} ${POS[w.pos].name}</span>`);
        }
        const b = $(`[data-b="${w.pos}"]`, bks);
        b.classList.add('hintable', 'flash');
        setHint(`${revealTip(w)} —— 把它点进 ${POS[w.pos].emoji} ${POS[w.pos].name} 吧`, 'tip');
      } else {
        setHint(`❌ ` + wrongTip(w, bucketKey), 'bad');
      }
      sel = null;
      $$('.wcard', pool).forEach(x => x.classList.remove('sel'));
    };

    pool.addEventListener('click', e => {
      if (locked) return;
      const card = e.target.closest('.wcard');
      if (!card || card.classList.contains('used')) return;
      const already = card.classList.contains('sel');
      $$('.wcard', pool).forEach(x => x.classList.remove('sel'));
      if (already) { sel = null; return; }
      card.classList.add('sel'); sel = Number(card.dataset.i); Sound.tap();
      setHint('选好了，现在点它该去的岗位 👇', 'tip');
    });

    bks.addEventListener('click', e => {
      if (locked) return;
      const b = e.target.closest('.bucket');
      if (!b) return;
      Sound.tap();
      if (sel === null) {
        b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 400);
        setHint('先点上面的一个<b>单词</b>，再点岗位 👆', 'tip');
        return;
      }
      const card = $(`[data-i="${sel}"]`, pool);
      if (!card || card.classList.contains('used')) { sel = null; return; }
      const w = items[sel];
      if (w.pos === b.dataset.b) correct(card, w);
      else wrong(card, w, b.dataset.b);
    });
  });
}

/* ================= 10 · 题型 B：句子大解剖 ================= */
function roundSentence(cfg, buckets, onDone) {
  return new Promise(resolve => {
    const tokens = cfg.tokens;
    const targets = tokens.filter(t => !t.plain);
    let sel = null, resolved = 0, wrongTotal = 0, locked = false;
    const wrongCount = {};
    const total = targets.length;

    paint(`
      <div class="bar-wrap">
        <span>这句里有</span>
        <div class="bar"><i id="pbar"></i></div>
        <span class="mono-num" id="pnum">0/${total}</span>
      </div>
      <div class="panel">
        <div class="row" style="margin-bottom:9px">
          <span class="h3">句子里的每个词都有岗位</span>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--sub)">点词 → 点岗位</span>
        </div>
        <div class="chips" id="chips">
          ${tokens.map((t, i) => t.plain
        ? `<span class="fnw">${esc(t.w)}</span>`
        : `<button class="chip" data-i="${i}" data-pos="${t.pos}">${esc(t.w)}<span class="c-tag">?</span></button>`).join('')}
        </div>
        <div class="center" style="font-size:12.5px;color:var(--sub);margin-top:6px">${esc(cfg.zh)}</div>
        <div class="buckets${buckets.length >= 5 ? ' five' : ''}" id="buckets" style="margin-top:12px">
          ${buckets.map((k, bi) => `<button class="bucket b-${k}" data-b="${k}" style="min-height:auto">
            <span class="b-head"><span class="b-name"><i class="b-key">${bi + 1}</i>${POS[k].emoji} ${POS[k].name}</span><small>· ${POS[k].short}</small>
              <span class="b-count" data-c="${k}">0</span></span>
          </button>`).join('')}
        </div>
      </div>
    `);
    putHint('灰色的词（the、two…）先不用管，只给有颜色的词分岗位。', 'tip');

    const chips = $('#chips'), bks = $('#buckets');
    const updateBar = () => {
      $('#pbar').style.width = (resolved / total * 100) + '%';
      $('#pnum').textContent = `${resolved}/${total}`;
    };

    chips.addEventListener('click', e => {
      if (locked) return;
      const c = e.target.closest('.chip');
      if (!c || c.classList.contains('found')) return;
      const already = c.classList.contains('sel');
      $$('.chip', chips).forEach(x => x.classList.remove('sel'));
      if (already) { sel = null; return; }
      c.style.outline = '3px solid #f0ad2b'; c.style.outlineOffset = '2px';
      sel = Number(c.dataset.i); Sound.tap();
      setHint('很好，现在告诉我它是哪个岗位 👇', 'tip');
    });

    bks.addEventListener('click', e => {
      if (locked) return;
      const b = e.target.closest('.bucket');
      if (!b) return;
      Sound.tap();
      if (sel === null) {
        setHint('先点句子里的一个<b>词</b>，再点它的岗位 👆', 'tip');
        b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 400);
        return;
      }
      const chip = $(`.chip[data-i="${sel}"]`, chips);
      if (!chip || chip.classList.contains('found')) { sel = null; return; }
      const t = tokens[sel];
      if (t.pos === b.dataset.b) {
        chip.classList.remove('sel');
        chip.style.outline = '';
        chip.classList.add('found', t.pos);
        $('.c-tag', chip).textContent = POS[t.pos].name;
        const cnt = $(`[data-c="${t.pos}"]`, bks);
        cnt.textContent = String(Number(cnt.textContent) + 1);
        b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 420);
        resolved++; updateBar();
        Sound.ok(); Sound.say(cfg.en);
        setHint(`✅ <b>${esc(t.w)}</b> 是${POS[t.pos].name} —— ${POS[t.pos].probe}`, 'ok');
        sel = null;
        if (resolved === total) {
          locked = true;
          setHint(`🎬 整句读一遍：<b>${esc(cfg.en)}</b>`, 'ok');
          setTimeout(() => { onDone(wrongTotal); resolve(); }, 900);
        }
      } else {
        chip.classList.remove('sel');
        chip.style.outline = '';
        chip.classList.add('wrong');
        setTimeout(() => chip.classList.remove('wrong'), 420);
        wrongCount[t.w] = (wrongCount[t.w] || 0) + 1;
        wrongTotal++;
        Sound.no();
        if (noteWrong()) { locked = true; setTimeout(levelFailed, 600); return; }
        const fake = { en: t.w, zh: '…', pos: t.pos };
        if (wrongCount[t.w] >= 2) {
          chip.classList.add('found', t.pos);
          $('.c-tag', chip).textContent = POS[t.pos].name;
          resolved++; updateBar();
          setHint(`${revealTip(fake)} —— 已经帮你标好啦`, 'tip');
        } else {
          setHint(`❌ <b>${esc(t.w)}</b> 不是「${POS[b.dataset.b].name}」哦 —— ${POS[t.pos].probe}`, 'bad');
        }
        sel = null;
      }
    });
  });
}

/* ================= 11 · 题型 C：按岗位拼句子 ================= */
function roundBuild(cfg, onDone) {
  return new Promise(resolve => {
    const slotIdx = cfg.parts.map((p, i) => p.t === 'slot' ? i : -1).filter(i => i >= 0);
    const filled = {};
    let sel = null, wrongTotal = 0, locked = false;
    const totalSlots = slotIdx.length;

    paint(`
      <div class="panel">
        <div class="build-scene">
          <div class="bs-top">
            <span class="bs-actor" id="actor">${cfg.scene.emoji}</span>
            <span class="bs-goal">目标：<b>${esc(cfg.zh)}</b></span>
          </div>
          <div class="sentence" id="frame">
            ${cfg.parts.map((p, i) => p.t === 'text'
        ? `<span class="wstatic">${esc(p.v)}</span>`
        : `<button class="slot" data-slot="${i}" data-need="${p.pos}"${p.expect ? ` data-expect="${esc(p.expect)}"` : ''}>
                   <span class="s-ph">放这里</span>
                   <span class="s-lab">${POS[p.pos].name}</span>
                 </button>`).join('')}
          </div>
          <div class="bs-read" id="sceneSent"></div>
        </div>

        <div class="pool" id="pool" style="margin-top:10px">
          ${shuffle(cfg.pool).map((w, i) => `<button class="wcard" data-i="${i}" data-en="${esc(w.en)}" data-pos="${w.pos}">
            <span class="wc-emoji">${w.emoji || ''}</span>
            <span class="wc-en">${esc(w.en)}</span>
            <span class="wc-zh">${esc(w.zh)}</span>
          </button>`).join('')}
        </div>
      </div>
    `);
    putHint('先看目标句子，再按「什么岗位就放哪个位置」来拼。点单词 → 点空位。', 'tip');

    const pool = $('#pool'), frame = $('#frame');
    const poolWords = cfg.pool;
    // 记录 pool 索引对应的词（shuffle 后从 DOM 读取顺序）

    const refresh = () => {
      let done = 0;
      const html = cfg.parts.map((p, i) => {
        if (p.t === 'text') return esc(p.v);
        const w = filled[i];
        if (!w) return '';
        done++;
        return `<span class="hl-${w.pos}">${esc(w.en)}</span>`;
      }).join(' ');
      $('#sceneSent').innerHTML = done === totalSlots ? html : '';
      $('#sceneSent').classList.toggle('on', done === totalSlots);
    };

    pool.addEventListener('click', e => {
      if (locked) return;
      const card = e.target.closest('.wcard');
      if (!card || card.classList.contains('used')) return;
      const already = card.classList.contains('sel');
      $$('.wcard', pool).forEach(x => x.classList.remove('sel'));
      if (already) { sel = null; return; }
      card.classList.add('sel'); sel = card.dataset.en; Sound.tap();
      setHint('它属于哪个空位呢？点一下空位 👇', 'tip');
    });

    frame.addEventListener('click', e => {
      if (locked) return;
      const slot = e.target.closest('.slot');
      if (!slot) return;
      Sound.tap();
      const si = Number(slot.dataset.slot);

      // 已经填了 → 取回来
      if (filled[si]) {
        const w = filled[si];
        delete filled[si];
        slot.classList.remove('filled', 'ok');
        slot.innerHTML = `<span class="s-ph">放这里</span><span class="s-lab">${POS[cfg.parts[si].pos].name}</span>`;
        if (cfg.parts[si].expect) slot.dataset.expect = cfg.parts[si].expect;
        const card = $$('.wcard', pool).find(c => c.dataset.en === w.en && c.classList.contains('used'));
        if (card) card.classList.remove('used');
        refresh(); setHint('拿回来了，再想想放哪里～', 'tip');
        return;
      }

      if (!sel) { setHint('先点下面一个<b>单词</b>，再点空位 👇', 'tip'); slot.classList.add('bad'); setTimeout(() => slot.classList.remove('bad'), 400); return; }

      const w = poolWords.find(x => x.en === sel) || { en: sel, zh: '', pos: '?' };
      const part = cfg.parts[si];
      const need = part.pos;
      // 同词性有多个候选时，用 expect 精确校验，避免「词性对、词不对」也算过
      const samePos = poolWords.filter(x => x.pos === need).length;
      const posOk = w.pos === need;
      const exactOk = part.expect ? w.en === part.expect : true;
      const needExact = !!part.expect || samePos > 1;

      if (posOk && (needExact ? exactOk : true)) {
        filled[si] = w;
        slot.classList.add('filled', 'ok');
        slot.innerHTML = `<span class="s-en">${esc(w.en)}</span><span class="s-zh">${POS[w.pos].emoji}</span>`;
        const card = $$('.wcard', pool).find(c => c.dataset.en === w.en);
        if (card) { card.classList.remove('sel'); card.classList.add('used'); }
        sel = null; Sound.ok(); Sound.say(w.en);
        setHint(`✅ ${esc(w.en)} 是${POS[w.pos].name}，放在这个位置刚好！`, 'ok');
        refresh();
        if (Object.keys(filled).length === totalSlots) {
          locked = true;
          const actor = $('#actor');
          actor.classList.add('act-' + (cfg.scene.anim || 'hop'));
          setTimeout(() => Sound.say(cfg.speak), 400);
          setTimeout(() => {
            setHint(`🎬 <b>${esc(cfg.speak)}</b> —— ${esc(cfg.zh)}`, 'ok');
            setTimeout(() => { onDone(wrongTotal); resolve(); }, 900);
          }, 700);
        }
      } else {
        slot.classList.add('bad'); setTimeout(() => slot.classList.remove('bad'), 420);
        const card = $$('.wcard', pool).find(c => c.dataset.en === sel);
        if (card) { card.classList.add('wrong'); setTimeout(() => card.classList.remove('wrong'), 420); }
        wrongTotal++; Sound.no();
        if (noteWrong()) { locked = true; setTimeout(levelFailed, 600); return; }
        if (posOk && !exactOk) {
          setHint(`❌ 词性对了，但这句话要选<b>另一个</b>词 —— 看看目标句子：「${esc(cfg.zh)}」。`, 'bad');
        } else {
          setHint(`❌ ${esc(sel)} 是${POS[w.pos] ? POS[w.pos].name : '另一个岗位'}，这个空位要放 <b>${POS[need].name}</b> 呀。`, 'bad');
        }
        sel = null;
      }
    });

    refresh();
  });
}

/* ================= 12 · 题型 D：选择题 ================= */
function roundChoice(cfg, onDone) {
  return new Promise(resolve => {
    paint(`
      <div class="panel">
        <div class="row" style="margin-bottom:12px"><span class="h3">${esc(cfg.q)}</span></div>
        <div class="opts" id="opts">
          ${cfg.options.map((o, i) => `<button class="opt" data-i="${i}">
            <span class="o-key">${'ABCD'[i]}</span><span>${esc(o.v)}</span>
          </button>`).join('')}
        </div>
      </div>
    `);
    putHint('选一个你觉得对的就好，选错了也没关系。', 'tip');
    let wrong = 0, locked = false;
    $('#opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || locked) return;
      const i = Number(b.dataset.i);
      if (i === cfg.answer) {
        locked = true;
        b.classList.add('right'); Sound.ok(); Sound.say(cfg.options[i].v);
        setHint(`✅ ${esc(cfg.why)}`, 'ok');
        setTimeout(() => { onDone(wrong); resolve(); }, 1100);
      } else {
        wrong++; b.classList.add('wrong'); Sound.no();
        if (noteWrong()) { locked = true; setTimeout(levelFailed, 600); return; }
        b.disabled = true;
        setHint(`❌ 再想想：${esc(cfg.hint || '用「三个问题」问一问它。')}`, 'bad');
      }
    });
  });
}

/* ================= 13 · 关卡调度 ================= */
const run = { id: 1, idx: 0, wrong: 0, hearts: 0, failed: false };

function renderHearts() {
  const box = document.getElementById('hearts');
  if (!box) return;
  const lv = LEVELS[run.id - 1];
  if (!lv || !lv.hearts) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const left = run.hearts;
  box.innerHTML = Array.from({ length: lv.hearts },
    (_, i) => `<span class="${i < left ? '' : 'gone'}">💛</span>`).join('');
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}

/** 记一次错误：星星结算 + 爱心结算；返回 true 表示爱心用完了 */
function noteWrong() {
  run.wrong++;
  const lv = LEVELS[run.id - 1];
  if (lv && lv.hearts) {
    run.hearts = Math.max(0, run.hearts - 1);
    renderHearts();
    if (run.hearts === 0) { run.failed = true; return true; }
    if (run.hearts === 1) toast('只剩最后一颗心啦 💛', 1200);
  }
  return false;
}

async function startLevel(id) {
  const lv = LEVELS[id - 1];
  run.id = id; run.idx = 0; run.wrong = 0; run.failed = false;
  run.hearts = lv.hearts || 0;
  renderHearts();

  // 1) 先认识新角色（每关最多引入一个新信息块）
  if (lv.newRoles && lv.newRoles.length) {
    const learned = [];
    for (let i = 0; i < id - 1; i++) {
      (LEVELS[i].newRoles || []).forEach(k => { if (!learned.includes(k)) learned.push(k); });
    }
    setTitle(`第${id}关 · 认识新角色`);
    await screenMeet(lv.newRoles, learned);
  }
  nextRound();
}

async function nextRound() {
  const lv = LEVELS[run.id - 1];
  if (run.failed) return;
  if (run.idx >= lv.rounds.length) return finishLevel();

  setTitle(`第${run.id}关 · ${lv.name} ${run.idx + 1}/${lv.rounds.length}`);
  const cfg = lv.rounds[run.idx];
  const buckets = cfg.buckets || lv.buckets;

  let roundWrong = 0;
  const collect = (w) => { roundWrong = w; };

  if (cfg.type === 'sort') await roundSort(cfg, buckets, collect);
  else if (cfg.type === 'sentence') await roundSentence(cfg, buckets, collect);
  else if (cfg.type === 'build') await roundBuild(cfg, collect);
  else if (cfg.type === 'choice') await roundChoice(cfg, collect);

  if (run.failed) return;
  run.idx++;
  await wait(180);
  nextRound();
}

function levelFailed() {
  const lv = LEVELS[run.id - 1];
  setTitle(`第${run.id}关 · ${lv.name}`);
  Sound.no();
  paint(`
    <div class="panel center" style="padding:26px 18px">
      <div style="font-size:56px">💛</div>
      <h2 class="h2" style="margin-top:8px">三颗心用完啦</h2>
      <p class="lead" style="margin-top:6px">没关系，再来一次一定行！<br>这一次试试：<b>先用三个问题问一问这个词</b>。</p>
      <div class="row center" style="margin-top:16px">
        <button class="btn ghost" id="toMap">回地图</button>
        <button class="btn" id="retry">再挑战一次</button>
      </div>
    </div>
  `);
  $('#toMap').addEventListener('click', screenMap);
  $('#retry').addEventListener('click', () => { Sound.tap(); startLevel(run.id); });
}

function starsFor() {
  const w = run.wrong;
  if (w === 0) return 3;
  if (w <= 2) return 2;
  return 1;
}

function finishLevel() {
  const lv = LEVELS[run.id - 1];
  const st = starsFor();
  Store.setLevel(lv.id, st);
  Store.addStars(st);
  Sound.win();
  closeSheet();

  const isLast = lv.id === LEVELS.length;
  const nextLv = LEVELS[lv.id];
  const canNext = nextLv && Store.unlocked(nextLv.id);

  if (isLast) return showCertificate(st);

  sheet(`
    <div class="big">${st === 3 ? '🏆' : st === 2 ? '🎉' : '👍'}</div>
    <h3>第 ${lv.id} 关 · 通过！</h3>
    <p style="margin-top:4px">${st === 3 ? '全对！你已经是小小词性专家了。' : st === 2 ? '很棒，再细心一点就满分啦。' : '完成了！多玩一次会更熟练。'}</p>
    <div style="font-size:30px;letter-spacing:6px;color:var(--gold);margin:12px 0">${'★'.repeat(st)}<span style="color:#e8e0d0">${'★'.repeat(3 - st)}</span></div>
    <div class="row center" style="gap:10px">
      <button class="btn ghost small" id="m">回地图</button>
      <button class="btn small" id="n">${canNext ? '下一关 →' : '继续 →'}</button>
    </div>
  `);
  $('#m').addEventListener('click', () => { closeSheet(); screenMap(); });
  $('#n').addEventListener('click', () => {
    closeSheet();
    if (canNext) startLevel(nextLv.id); else screenMap();
  });
}

function showCertificate(st) {
  const name = Store.data.name || '';
  paint(`
    <div class="center" style="padding:6px 0">
      <div style="font-size:56px">🎊</div>
      <h2 class="h2" style="margin-top:4px">全部通关！</h2>
    </div>
    <div class="cert">
      <div class="center">
        <div class="ct-title">W O R D   T H E A T E R   证 书</div>
        <div class="ct-name" id="certName">${name ? esc(name) : '小小词性专家'}</div>
        <div class="ct-desc">已经能分清 名词 · 动词 · 形容词 · 副词 · 介词</div>
        <div style="font-size:22px;letter-spacing:5px;color:var(--gold-dmer,var(--gold));margin:10px 0 6px">★★★</div>
      </div>
      <div class="props">
        <div class="prop">🏰</div><div class="prop">🏃</div><div class="prop">🎨</div><div class="prop">⚡</div>
        <div class="prop">📍</div><div class="prop">🧩</div><div class="prop">🔍</div><div class="prop">🎬</div>
        <div class="prop" style="grid-column:1 / -1;width:auto;justify-self:center">🏆 全岗位通关</div>
      </div>
      <div style="margin-top:12px">
        <input class="nameInput" id="nm" placeholder="写上你的名字，领证书" value="${esc(name)}" maxlength="12">
      </div>
    </div>
    <div class="row center" style="margin-top:12px">
      <button class="btn ghost small" id="back">回地图</button>
      <button class="btn small" id="save">保存名字</button>
    </div>
    <p class="center lead" style="margin-top:10px;font-size:12.5px;color:#a2988a">
      小提示：下次遇到不认识的英文单词，用「三个问题」问一问它。
    </p>
  `);
  putHint('🎬 恭喜杀青！五个岗位你都认得了。', 'ok');
  $('#save').addEventListener('click', () => {
    Store.data.name = $('#nm').value.trim(); Store.save();
    $('#certName').textContent = Store.data.name || '小小词性专家';
    toast('名字已保存 ✅'); Sound.ok();
  });
  $('#back').addEventListener('click', screenMap);
  Sound.win();
}

/* ================= 14 · 设置 ================= */
function openSettings() {
  const card = sheet(`
    <div class="big">⚙️</div>
    <h3>设置</h3>
    <div style="text-align:left;margin-top:14px;display:grid;gap:10px">
      <button class="btn ghost" id="sSound" style="width:100%;justify-content:space-between">
        <span>🔊 音效与朗读</span><b id="sSoundV">${Sound.on ? '开' : '关'}</b>
      </button>
      <button class="btn ghost" id="sUnlock" style="width:100%">🔓 解锁全部关卡（家长）</button>
      <button class="btn ghost" id="sReset" style="width:100%;color:#b8362b">🗑️ 清空进度重新开始</button>
    </div>
    <p style="font-size:11.5px;color:#a2988a;margin-top:12px;line-height:1.6;text-align:left">
      设计依据：认知负荷理论（每关只加一个新词性）+ 交替实例原则（例子不断换场景，结构不变）。
    </p>
    <button class="btn" id="sClose" style="margin-top:14px;width:100%">关闭</button>
  `);
  $('#sSound', card).addEventListener('click', () => {
    Sound.on = !Sound.on;
    Sound.on ? Sound.init() : null;
    $('#sSoundV', card).textContent = Sound.on ? '开' : '关';
    Store.data.sound = Sound.on; Store.save();
    if (Sound.on) Sound.ok();
  });
  $('#sUnlock', card).addEventListener('click', () => {
    Store.data.unlockAll = true; Store.save(); closeSheet(); screenMap(); toast('已解锁全部关卡 🔓');
  });
  $('#sReset', card).addEventListener('click', () => {
    Store.reset(); Store.data.unlockAll = false; Store.save();
    closeSheet(); paintStars(); screenMap(); toast('进度已清空');
  });
  $('#sClose', card).addEventListener('click', closeSheet);
}

/* ================= 15 · 启动 ================= */
function boot() {
  Store.load();
  Sound.on = Store.data.sound !== false;
  paintStars();
  screenMap();

  document.getElementById('btnHome').addEventListener('click', () => {
    Sound.tap();
    const lv = LEVELS[run.id - 1];
    if (stageEl().querySelector('.map-grid')) return;
    sheet(`
      <div class="big">🗺️</div>
      <h3>回到地图？</h3>
      <p>这一关的进度会保留哦</p>
      <div class="row center" style="margin-top:14px;gap:10px">
        <button class="btn ghost small" id="c">继续玩</button>
        <button class="btn small" id="y">回地图</button>
      </div>
    `);
    $('#c').addEventListener('click', closeSheet);
    $('#y').addEventListener('click', () => { closeSheet(); screenMap(); });
  });

  document.getElementById('btnSet').addEventListener('click', () => { Sound.tap(); openSettings(); });

  // 首次交互解锁音频
  const unlock = () => { Sound.init(); document.removeEventListener('pointerdown', unlock); };
  document.addEventListener('pointerdown', unlock);

  // 键盘：Esc 关闭弹层；数字键按「屏幕上第几个岗位」快捷选择（方便大屏 / 老师演示）
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('sheetRoot').innerHTML) closeSheet();
      return;
    }
    // 按屏幕上的实际顺序取桶，这样只显示 2 个岗位时按 3 不会误点
    const idx = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 }[e.key];
    if (idx === undefined) return;
    const b = $$('.bucket')[idx];
    if (b) b.click();
  });
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
